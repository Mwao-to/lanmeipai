plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.binsys.wy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.binsys.wy'
        minSdk 24          // Android 7.0+
        targetSdk 34
        versionCode 3
        versionName '1.2.0'   // 诊断版:全链路日志落盘
        ndk { abiFilters 'arm64-v8a' }   // 仅编译 arm64
        python {
            // 内嵌 Python 运行时依赖:Flask 本地服务 + requests 网易云接口
            pip {
                install 'flask'
                install 'requests'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'Lanmei2026'
            keyAlias 'wyapp'
            keyPassword 'Lanmei2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
