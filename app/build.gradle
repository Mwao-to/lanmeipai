plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.binsys.wy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.binsys.wy'
        minSdk 24          // Android 7.0+
        targetSdk 34
        versionCode 107
        versionName '3.93'   // 修复v3.92合并下载报错:api_merge尾部误用不存在的Dbg.i日志对象→NameError→Flask 500→前端提示下载失败;删除该行;本地冒烟验证三分支嵌入逻辑(mp3五帧全存/flac标题歌词封面/aac原样保留)均通过
        ndk { abiFilters 'arm64-v8a' }   // 仅编译 arm64
        python {
            // 内嵌 Python 运行时依赖:Flask 本地服务 + requests 网易云接口
            // (业务核心 main_app 不在此处:以加密字节码形式由 CI 注入 assets/core.bin)
            pip {
                install 'flask'
                install 'requests'
                install 'qrcode'   // 纯Python:扫码登录二维码SVG本地渲染(A键兜底)
                install 'mutagen'  // v3.92合并下载:音频元数据嵌入(ID3v2/MP4/FLAC全容器)
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'Lanmei2026'
            keyAlias 'wyapp'
            keyPassword 'Lanmei2026'
        }
    }

    buildTypes {
        release {
            // R8 混淆:类名/方法名全部打乱(保留 JS 桥接方法名与 Chaquopy SDK)
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // v3.86:明文源已移至 app/htmlsrc/(不参与打包),assets 内仅构建期生成的加密 index.bin
}

// ═══ 构建期打包:assets/index.html(仓库内唯一明文源) → index.bin 加密产物 ═══
// 算法与 MainActivity.xorDecrypt / tools/crypt_html.py 同构: keystream[i]=SHA256(KEY‖u32be(block)) 异或
// APK 中不再存在明文 HTML(dex 内的 EMBEDDED_ENC 也是同算法密文),运行时解密 ~200KB <10ms 无性能损耗
tasks.register('packEncryptedHtml') {
    def srcFile = file('htmlsrc/index.html')
    def dstFile = file('src/main/assets/index.bin')
    inputs.file(srcFile)
    outputs.file(dstFile)
    doLast {
        def keyParts = ['9f3ac1e2', '5d84bb07', '21ce6a49', 'f0183d76', 'ab52de90', '47c31f68', 'd9b024af', '6e1c8533']
        def key = new byte[32]
        keyParts.eachWithIndex { p, ki ->
            for (int j = 0; j < 4; j++) key[ki * 4 + j] = (byte) Integer.parseInt(p.substring(j * 2, j * 2 + 2), 16)
        }
        def data = srcFile.bytes
        def md = java.security.MessageDigest.getInstance('SHA-256')
        def out = new byte[data.length]
        int i = 0, counter = 0
        while (i < data.length) {
            md.reset()
            md.update(key)
            md.update((byte) (counter >>> 24)); md.update((byte) (counter >>> 16))
            md.update((byte) (counter >>> 8)); md.update((byte) counter)
            def h = md.digest()
            int n = Math.min(32, data.length - i)
            for (int j = 0; j < n; j++) out[i + j] = (byte) (data[i + j] ^ h[j])
            i += n; counter++
        }
        dstFile.bytes = out
        println "✓ assets/index.bin 已加密打包 (${data.length}B 明文→密文)"
    }
}
preBuild.dependsOn 'packEncryptedHtml'
