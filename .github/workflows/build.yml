name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 GITHUB_TOKEN 创建 Release 并上传 APK
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'


      - name: Build arm64 release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk lanmeipai-arm64.apk
          ls -lh lanmeipai-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanmeipai-arm64-apk
          path: lanmeipai-arm64.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: lanmeipai-arm64.apk
          generate_release_notes: true
