name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 GITHUB_TOKEN 创建 Release 并上传 APK
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ═══ 业务核心保护流水线 ═══
      # 用真实 Python 3.8 编译业务源码为字节码 → AES-256 加密 → assets/core.bin
      - name: Set up Python 3.8 (bytecode compiler)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Encrypt core bytecode → assets/core.bin
        env:
          CORE_KEY: "0aa70d07121b452d567eb6af8053d586b9187fd21b655d7ada39fd1b2917ced2"
          CORE_IV: "927f2fab9174d8eac24b57f7eb2bd2ed"
        run: |
          cd app/corepkg
          python3 - <<'PY'
          import py_compile, sys
          assert sys.version_info[:2] == (3, 8), "必须用 Python 3.8 生成字节码,当前: %s" % (sys.version_info[:2],)
          py_compile.compile('src/main_app.py', 'core.pyc', doraise=True)
          data = open('core.pyc', 'rb').read()
          assert data[:4] == bytes([0x55, 0x0d, 0x0d, 0x0a]), "非 3.8 字节码魔数"
          open('core.marshal', 'wb').write(data[16:])   # 去掉 16 字节 pyc 头,仅保留 marshal 体
          print("✓ 字节码生成:", len(data[16:]), "字节")
          PY
          mkdir -p ../src/main/assets
          openssl enc -aes-256-cbc -K "$CORE_KEY" -iv "$CORE_IV" -in core.marshal -out ../src/main/assets/core.bin
          rm -f core.pyc core.marshal
          test -f ../src/main/assets/core.bin || { echo '‼️ core.bin 未生成'; exit 1; }
          echo "✓ core.bin: $(stat -c%s ../src/main/assets/core.bin) 字节(AES-256-CBC)"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build arm64 release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk lanmeipai-arm64.apk
          ls -lh lanmeipai-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanmeipai-arm64-apk
          path: lanmeipai-arm64.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: lanmeipai-arm64.apk
          generate_release_notes: true
